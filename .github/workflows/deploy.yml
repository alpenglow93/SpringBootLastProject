name: Deploy With Docker to AWS Server
# on : 실행조건
on:
  push:
    branches:
      - master  #해당 브랜치(master) 에서 commit and push = [main,master] (여러개일 경우)
jobs:
  deploy:
    # Github Actions가 제공하는 Ubuntu 환경에서 실행
    # AWS EC2 가 아닌 Github Actions 의 임시로 사용하는 Ubuntu
    runs-on: ubuntu-latest

    # 실행 순서 지정
    # name = stage = step
    steps:
      # 어떤 소스를 가지고 올지 => src / build.gradle gradlew
      #코드 체크
      - name: Checkout repository
        uses: actions/checkout@v4
      # JDK 설정 => SpringBoot 프로젝트를 build => JDK 설정
      - name: SetUp JDK 21
        uses: actions/setup-java@v4
        with:
          # temurin : 가장 최소(가벼운) 단위 JDK = 이클립스 JDK 사용
          distribution: 'temurin'
          java-version: '21'
      

# Gradlew  권한 부여
      - name: Set gradlew permission
        run: |
          chmod +x ./gradlew
# Gradle Build
      - name: Build with Gradlew
        run: ./gradlew clean build -x test
# Docker Hub 연결 = 로그인
      - name: Login Docker Hub
        run: |
          echo "${{secrets.DOCKER_PASSWORD}}" |\
          docker login \
          -u "${{secrets.DOCKER_USERNAME}}" \
          --password-stdin
# Docker 이미지 생성
      - name: Build Docker Image
        run: |
          docker build \
          -t ${{secrets.DOCKER_USERNAME}}/last-app:latest .
# DockerHub에 올린다
      - name: Push Docker Image
        run: |
          docker push \
          ${{secrets.DOCKER_USERNAME}}/last-app:latest
# AWS 연결 => DockerHub 데이터 Pull
      - name: Set SSH key Permission
        run: |
          mkdir -p ~/.ssh
          echo "${{secrets.SERVER_SSH_KEY}}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
# ADD SSH Key
      - name: Add SSH Key
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{secrets.SERVER_SSH_KEY}}
# Add Known_hosts
      - name: Add Known_hosts
        run: |
          ssh-keyscan -H 52.79.240.143 >> ~/.ssh/known_host
# 환경설정
# DB 관련 => .env
      - name: 환경설정
        run: |
          ssh ubuntu@52.79.240.143 << EOF
            mkdir -p ~/app
            cd ~/app
            rm -f .env
            
            echo "DB_URL=${{secrets.TEAMDB_URL}}" >> ~/app/.env
            echo "DB_USERNAME=${{secrets.DB_USERNAME}}" >> ~/app/.env
            echo "DB_PASSWORD=${{secrets.DB_PASSWORD}}" >> ~/app/.env
            chmod 600 ~/app/.env
          EOF
# Deploy on server DockerHub Image using
      - name: DockerHub Image using
        run: |
          ssh ubuntu@52.79.240.143 << 'EOF'
            docker stop last-app || true
            docker rm last-app || true
            docker pull ${{secrets.DOCKER_USERNAME}}/last-app:latest
            docker run -d --name last-app --env-file ~/app/.env -p 9090:9090 ${{secrets.DOCKER_USERNAME}}/last-app:latest
          EOF
